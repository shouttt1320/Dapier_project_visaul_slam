/**:
  ros__parameters:
    # Vision & Camera Parameters (YDLIDAR OS30A: HFOV 78.0 deg)
    image_topic: "/camera/color/image_raw"
    use_compressed: false
    camera_hfov_deg: 78.0
    min_area: 400.0

    # Dual HSV Thresholds for Red Color
    lower_red1: [0, 100, 70]
    upper_red1: [10, 255, 255]
    lower_red2: [165, 100, 70]
    upper_red2: [180, 255, 255]

    # Coordinate & TF Parameters
    target_frame: "map"
    base_frame: "base_footprint"
    camera_optical_frame: "camera_color_optical_frame"
    depth_roi_radius: 10
    min_depth: 0.20
    max_depth: 2.50

    # Navigation & Mission Parameters
    stop_distance: 0.5            # meters in front of the red box
    search_angular_velocity: 0.15  # rad/s for 360-degree search spin (gentle)
    fine_align_angular_velocity: 0.08
    align_pixel_tolerance: 25.0    # pixel center alignment tolerance
